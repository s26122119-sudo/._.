<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 可愛又帥氣迷因產生器 ⚡ Meme Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <!-- html2canvas CDN for image download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- FontAwesome for cool icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: #0f1015;
            background-image: 
                radial-gradient(at 10% 10%, rgba(255, 110, 199, 0.2) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(0, 245, 212, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(123, 97, 255, 0.15) 0px, transparent 50%);
            color: #f3f4f6;
            min-height: 100vh;
        }

        /* Cyber-Pop Glass Card */
        .glass-panel {
            background: rgba(22, 25, 37, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        /* Neon Glow Utility */
        .neon-pink-btn {
            background: linear-gradient(135deg, #ff007f, #ff66b2);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: all 0.2s ease;
        }
        .neon-pink-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
        }

        .neon-mint-btn {
            background: linear-gradient(135deg, #00f5d4, #00bbf9);
            color: #0d1117;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.5);
            transition: all 0.2s ease;
        }
        .neon-mint-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.8);
        }

        /* Meme Text Overlay Style */
        .meme-text {
            font-family: 'Black Ops One', 'Noto Sans TC', impact, sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            user-select: none;
            cursor: move;
            touch-action: none;
            word-break: break-word;
            line-height: 1.1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff007f;
        }

        /* Cute Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: #1f2937;
            border-radius: 8px;
            height: 8px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #00f5d4;
            cursor: pointer;
            box-shadow: 0 0 10px #00f5d4;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="p-3 md:p-8 flex flex-col justify-between items-center">

    <!-- Header Section -->
    <header class="w-full max-w-6xl text-center mb-6">
        <div class="inline-block relative">
            <span class="absolute -top-3 -left-6 bg-pink-500 text-white text-xs px-2 py-0.5 rounded-full font-bold transform -rotate-12 shadow-lg">COOL & CUTE</span>
            <h1 class="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 tracking-wider">
                ⚡ 迷因超能發射器 ⚡
            </h1>
        </div>
        <p class="text-xs md:text-sm text-gray-400 mt-2">可愛帥氣二合一！隨選圖檔、自由拖曳文字，一鍵產出獨一無二梗圖！</p>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- Left Column: Meme Preview Display (7 cols) -->
        <section class="lg:col-span-7 flex flex-col items-center w-full">
            <div class="glass-panel p-4 md:p-6 rounded-3xl w-full flex flex-col items-center relative">
                
                <div class="flex justify-between items-center w-full mb-3 px-2">
                    <span class="text-xs md:text-sm font-semibold text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-eye text-cyan-400"></i> 即時預覽畫布 <span class="text-xs text-gray-500">(文字可直接滑鼠/手指拖曳)</span>
                    </span>
                    <button id="reset-btn" class="text-xs text-gray-400 hover:text-pink-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-rotate-left"></i> 重置位置
                    </button>
                </div>

                <!-- Meme Container Canvas Frame -->
                <div id="meme-container" class="relative overflow-hidden rounded-2xl bg-black border-2 border-slate-700 shadow-2xl flex items-center justify-center max-w-full min-h-[300px] md:min-h-[400px]">
                    
                    <!-- Background Image -->
                    <img id="meme-image" src="" alt="Meme Background" class="max-w-full max-h-[70vh] object-contain block transition-all duration-75">

                    <!-- Top Text Layer -->
                    <div id="top-text-display" class="meme-text absolute top-4 left-1/2 -translate-x-1/2 text-center text-white px-2 select-none">
                        TOP TEXT HERE
                    </div>

                    <!-- Bottom Text Layer -->
                    <div id="bottom-text-display" class="meme-text absolute bottom-4 left-1/2 -translate-x-1/2 text-center text-white px-2 select-none">
                        BOTTOM TEXT HERE
                    </div>

                </div>

                <!-- Preset Image Quick Pickers -->
                <div class="w-full mt-4">
                    <p class="text-xs text-gray-400 mb-2 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-bolt text-yellow-400"></i> 快速選用精選經典梗圖：
                    </p>
                    <div class="grid grid-cols-4 gap-2">
                        <button class="preset-img-btn rounded-xl overflow-hidden border-2 border-transparent hover:border-pink-500 transition focus:outline-none" data-url="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=600&q=80">
                            <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=150&q=80" class="w-full h-14 object-cover" alt="Cat Preset">
                        </button>
                        <button class="preset-img-btn rounded-xl overflow-hidden border-2 border-transparent hover:border-pink-500 transition focus:outline-none" data-url="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?auto=format&fit=crop&w=600&q=80">
                            <img src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?auto=format&fit=crop&w=150&q=80" class="w-full h-14 object-cover" alt="Dog Preset">
                        </button>
                        <button class="preset-img-btn rounded-xl overflow-hidden border-2 border-transparent hover:border-pink-500 transition focus:outline-none" data-url="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=80">
                            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=150&q=80" class="w-full h-14 object-cover" alt="Cool Cat">
                        </button>
                        <button class="preset-img-btn rounded-xl overflow-hidden border-2 border-transparent hover:border-pink-500 transition focus:outline-none" data-url="https://images.unsplash.com/photo-1507146426996-ef05306b995a?auto=format&fit=crop&w=600&q=80">
                            <img src="https://images.unsplash.com/photo-1507146426996-ef05306b995a?auto=format&fit=crop&w=150&q=80" class="w-full h-14 object-cover" alt="Puppy">
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- Right Column: Controls & Editing Panel (5 cols) -->
        <section class="lg:col-span-5 flex flex-col gap-4 w-full">
            
            <div class="glass-panel p-5 rounded-3xl flex flex-col gap-5">
                
                <!-- Section 1: File Upload -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">
                        <i class="fa-solid fa-cloud-arrow-up text-pink-400 mr-1"></i> 上傳本機圖檔 (安全無CORS限制)
                    </label>
                    <label class="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-gray-600 rounded-2xl cursor-pointer bg-slate-800/40 hover:bg-slate-800/80 hover:border-pink-500 transition group">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-image text-gray-400 group-hover:text-pink-400 text-xl"></i>
                            <span class="text-xs text-gray-300 group-hover:text-white font-medium">點擊或拖曳圖片到此處上傳</span>
                        </div>
                        <input id="image-upload" type="file" accept="image/*" class="hidden" />
                    </label>
                </div>

                <!-- Section 2: Text Inputs & Presets -->
                <div class="flex flex-col gap-3">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-bold text-gray-300">上方文字 (Top Text)</label>
                            <span class="text-[10px] text-gray-400">可拖曳文字移動</span>
                        </div>
                        <input id="top-text-input" type="text" value="當程式碼一次就順利過關" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500 transition" placeholder="輸入上方文字...">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">下方文字 (Bottom Text)</label>
                        <input id="bottom-text-input" type="text" value="我：這一定是有什麼誤會" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500 transition" placeholder="輸入下方文字...">
                    </div>

                    <!-- Quick Preset Words -->
                    <div class="flex flex-wrap gap-1.5 mt-1">
                        <span class="text-[11px] text-gray-400 self-center">熱門台詞:</span>
                        <button class="quick-text-btn bg-slate-800 hover:bg-pink-600 text-[11px] px-2 py-1 rounded-lg transition" data-top="WHEN YOU CODE" data-bottom="IT WORKS ON MY MACHINE">IT WORKS</button>
                        <button class="quick-text-btn bg-slate-800 hover:bg-pink-600 text-[11px] px-2 py-1 rounded-lg transition" data-top="以為放假會讀書" data-bottom="實際上：睡整天">放假現況</button>
                        <button class="quick-text-btn bg-slate-800 hover:bg-pink-600 text-[11px] px-2 py-1 rounded-lg transition" data-top="這不是Bug" data-bottom="這是未公開的功能！">這是功能</button>
                    </div>
                </div>

                <hr class="border-gray-800">

                <!-- Section 3: Fine Tuning Sliders & Color Selectors -->
                <div class="space-y-4">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1">
                        <i class="fa-solid fa-sliders"></i> 文字與圖片細節調整
                    </h3>

                    <!-- Font Size -->
                    <div>
                        <div class="flex justify-between text-xs text-gray-300 mb-1">
                            <span>字型大小 (Font Size)</span>
                            <span id="font-size-val" class="text-pink-400 font-mono">32px</span>
                        </div>
                        <input id="font-size-slider" type="range" min="16" max="72" value="32" class="w-full">
                    </div>

                    <!-- Colors: Text & Stroke -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">文字填充顏色</label>
                            <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                                <input id="text-color" type="color" value="#ffffff" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0">
                                <span id="text-color-hex" class="text-xs font-mono text-gray-400">#ffffff</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">粗邊框/陰影顏色</label>
                            <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                                <input id="stroke-color" type="color" value="#000000" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0">
                                <span id="stroke-color-hex" class="text-xs font-mono text-gray-400">#000000</span>
                            </div>
                        </div>
                    </div>

                    <!-- Rotation Slider -->
                    <div>
                        <div class="flex justify-between text-xs text-gray-300 mb-1">
                            <span>文字傾斜角度 (Rotation)</span>
                            <span id="rotation-val" class="text-cyan-400 font-mono">0°</span>
                        </div>
                        <input id="rotation-slider" type="range" min="-30" max="30" value="0" class="w-full">
                    </div>

                    <!-- Image Filters -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <div class="flex justify-between text-xs text-gray-300 mb-1">
                                <span>圖片亮度</span>
                                <span id="brightness-val" class="text-gray-400 font-mono">100%</span>
                            </div>
                            <input id="brightness-slider" type="range" min="50" max="150" value="100" class="w-full">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-gray-300 mb-1">
                                <span>圖片對比</span>
                                <span id="contrast-val" class="text-gray-400 font-mono">100%</span>
                            </div>
                            <input id="contrast-slider" type="range" min="50" max="150" value="100" class="w-full">
                        </div>
                    </div>
                </div>

                <!-- Section 4: Export Button -->
                <div class="mt-2">
                    <button id="download-btn" class="w-full neon-pink-btn text-white font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 text-base shadow-lg">
                        <i class="fa-solid fa-download"></i> 下載高清迷因圖片 (PNG)
                    </button>
                </div>

            </div>

        </section>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white border border-pink-500/50 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i id="toast-icon" class="fa-solid fa-circle-check text-pink-400 text-lg"></i>
        <span id="toast-msg" class="text-xs font-medium">訊息提示</span>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-gray-500">
        Designed with 💕 Cyber-Pop Pastel Theme • 2026 Meme Studio
    </footer>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const memeContainer = document.getElementById('meme-container');
            const memeImage = document.getElementById('meme-image');
            const topTextDisplay = document.getElementById('top-text-display');
            const bottomTextDisplay = document.getElementById('bottom-text-display');
            
            const imageUpload = document.getElementById('image-upload');
            const topTextInput = document.getElementById('top-text-input');
            const bottomTextInput = document.getElementById('bottom-text-input');
            
            const fontSizeSlider = document.getElementById('font-size-slider');
            const fontSizeVal = document.getElementById('font-size-val');
            const textColorInput = document.getElementById('text-color');
            const textColorHex = document.getElementById('text-color-hex');
            const strokeColorInput = document.getElementById('stroke-color');
            const strokeColorHex = document.getElementById('stroke-color-hex');
            
            const rotationSlider = document.getElementById('rotation-slider');
            const rotationVal = document.getElementById('rotation-val');
            
            const brightnessSlider = document.getElementById('brightness-slider');
            const brightnessVal = document.getElementById('brightness-val');
            const contrastSlider = document.getElementById('contrast-slider');
            const contrastVal = document.getElementById('contrast-val');
            
            const downloadBtn = document.getElementById('download-btn');
            const resetBtn = document.getElementById('reset-btn');

            // Initial Default Image Setup
            memeImage.src = 'https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=600&q=80';

            // 1. Text Update Functionality
            function updateText() {
                topTextDisplay.innerText = topTextInput.value || '';
                bottomTextDisplay.innerText = bottomTextInput.value || '';
            }
            topTextInput.addEventListener('input', updateText);
            bottomTextInput.addEventListener('input', updateText);

            // 2. Local File Upload via FileReader (Bypasses CORS)
            imageUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (!file.type.startsWith('image/')) {
                        showToast('請選擇有效的圖片檔案！', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        memeImage.src = event.target.result;
                        showToast('成功上傳自訂圖片！', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Preset Image Picker Click Event
            document.querySelectorAll('.preset-img-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.getAttribute('data-url');
                    memeImage.src = url;
                    showToast('已載入預設圖片', 'success');
                });
            });

            // Quick Text Template Buttons
            document.querySelectorAll('.quick-text-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    topTextInput.value = btn.getAttribute('data-top');
                    bottomTextInput.value = btn.getAttribute('data-bottom');
                    updateText();
                });
            });

            // 3. Style Tuning (Font size, Colors, Outline Text-Shadow)
            function updateStyles() {
                const size = fontSizeSlider.value;
                fontSizeVal.innerText = `${size}px`;
                
                const textColor = textColorInput.value;
                textColorHex.innerText = textColor;
                
                const strokeColor = strokeColorInput.value;
                strokeColorHex.innerText = strokeColor;
                
                const rot = rotationSlider.value;
                rotationVal.innerText = `${rot}°`;

                // Calculate multi-layer text-shadow for crisp heavy stroke on any bg
                const strokeShadow = `
                    -2px -2px 0 ${strokeColor},  
                     2px -2px 0 ${strokeColor},
                    -2px  2px 0 ${strokeColor},
                     2px  2px 0 ${strokeColor},
                    -3px  0px 0 ${strokeColor},
                     3px  0px 0 ${strokeColor},
                     0px -3px 0 ${strokeColor},
                     0px  3px 0 ${strokeColor},
                     0px  4px 10px rgba(0,0,0,0.8)
                `;

                [topTextDisplay, bottomTextDisplay].forEach(el => {
                    el.style.fontSize = `${size}px`;
                    el.style.color = textColor;
                    el.style.textShadow = strokeShadow;
                    el.style.transform = el.dataset.userMoved === 'true' 
                        ? `${el.dataset.baseTransform || ''} rotate(${rot}deg)` 
                        : `translateX(-50%) rotate(${rot}deg)`;
                });
            }

            fontSizeSlider.addEventListener('input', updateStyles);
            textColorInput.addEventListener('input', updateStyles);
            strokeColorInput.addEventListener('input', updateStyles);
            rotationSlider.addEventListener('input', updateStyles);

            // Image Filters Tuning
            function updateImageFilters() {
                const b = brightnessSlider.value;
                const c = contrastSlider.value;
                brightnessVal.innerText = `${b}%`;
                contrastVal.innerText = `${c}%`;
                memeImage.style.filter = `brightness(${b}%) contrast(${c}%)`;
            }

            brightnessSlider.addEventListener('input', updateImageFilters);
            contrastSlider.addEventListener('input', updateImageFilters);

            // 4. Drag & Touch Interaction for Text Positioning
            function makeDraggable(element) {
                let isDragging = false;
                let startX, startY, initialLeft, initialTop;

                function startDrag(e) {
                    isDragging = true;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    startX = clientX;
                    startY = clientY;

                    const rect = element.getBoundingClientRect();
                    const containerRect = memeContainer.getBoundingClientRect();

                    initialLeft = rect.left - containerRect.left;
                    initialTop = rect.top - containerRect.top;

                    element.style.bottom = 'auto';
                    element.style.right = 'auto';
                }

                function doDrag(e) {
                    if (!isDragging) return;
                    e.preventDefault();

                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    const deltaX = clientX - startX;
                    const deltaY = clientY - startY;

                    const rot = rotationSlider.value;
                    element.style.left = `${initialLeft + deltaX}px`;
                    element.style.top = `${initialTop + deltaY}px`;
                    element.style.transform = `rotate(${rot}deg)`;
                    
                    element.dataset.userMoved = 'true';
                    element.dataset.baseTransform = `translate(0, 0)`;
                }

                function stopDrag() {
                    isDragging = false;
                }

                element.addEventListener('mousedown', startDrag);
                window.addEventListener('mousemove', doDrag);
                window.addEventListener('mouseup', stopDrag);

                element.addEventListener('touchstart', startDrag, { passive: false });
                window.addEventListener('touchmove', doDrag, { passive: false });
                window.addEventListener('touchend', stopDrag);
            }

            makeDraggable(topTextDisplay);
            makeDraggable(bottomTextDisplay);

            // Reset Position Action
            resetBtn.addEventListener('click', () => {
                topTextDisplay.removeAttribute('style');
                bottomTextDisplay.removeAttribute('style');
                topTextDisplay.dataset.userMoved = 'false';
                bottomTextDisplay.dataset.userMoved = 'false';
                
                topTextDisplay.className = 'meme-text absolute top-4 left-1/2 -translate-x-1/2 text-center text-white px-2 select-none';
                bottomTextDisplay.className = 'meme-text absolute bottom-4 left-1/2 -translate-x-1/2 text-center text-white px-2 select-none';
                
                rotationSlider.value = 0;
                brightnessSlider.value = 100;
                contrastSlider.value = 100;
                
                updateStyles();
                updateImageFilters();
                showToast('已重置文字位置與圖片效果！', 'success');
            });

            // 5. Download Image via html2canvas
            downloadBtn.addEventListener('click', () => {
                showToast('正在產生高畫質迷因...', 'info');

                // Temporarily scale container for high quality export if needed
                html2canvas(memeContainer, {
                    allowTaint: true,
                    useCORS: true,
                    scale: 2, // High resolution
                    backgroundColor: null
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `meme-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('迷因下載成功！ 🎉', 'success');
                }).catch(err => {
                    console.error('Export Error:', err);
                    showToast('下載失敗，請嘗試使用本機上傳圖片。', 'error');
                });
            });

            // Helper Toast Function
            function showToast(msg, type = 'info') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toast-msg');
                const toastIcon = document.getElementById('toast-icon');

                toastMsg.innerText = msg;
                
                if (type === 'error') {
                    toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400 text-lg';
                } else if (type === 'success') {
                    toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
                } else {
                    toastIcon.className = 'fa-solid fa-circle-info text-cyan-400 text-lg';
                }

                toast.classList.remove('translate-y-20', 'opacity-0');
                
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2500);
            }

            // Initial Execution
            updateText();
            updateStyles();
            updateImageFilters();
        });
    </script>
</body>
</html>
