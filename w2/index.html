<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？隨機抽籤機</title>
    <style>
        /* 全域設定與淡雅粉背景 */
        body {
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #fcf4f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #5c4b51;
        }

        /* 主卡片容器 */
        .card {
            background-color: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(230, 180, 190, 0.25);
            text-align: center;
            box-sizing: border-box;
        }

        /* 標題樣式 */
        .title {
            font-size: 1.8rem;
            color: #d88195;
            margin-top: 0;
            margin-bottom: 20px;
            min-height: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }

        /* 圖片容器 */
        .image-container {
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .image-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        /* 按鈕容器與通用樣式 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* 點我抽籤按鈕（粉色） */
        .btn-primary {
            background-color: #f7cad0;
            color: #6b3b47;
            box-shadow: 0 4px 12px rgba(247, 202, 208, 0.6);
        }

        .btn-primary:hover {
            background-color: #f2b5be;
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* 馬上出發按鈕（深粉色） */
        .btn-secondary {
            background-color: #e295a8;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(226, 149, 168, 0.5);
        }

        .btn-secondary:hover {
            background-color: #d88195;
            transform: translateY(-2px);
        }

        /* 隱藏元素用 */
        .hidden {
            display: none !important;
        }

        /* 彈跳動畫關鍵影格 */
        .bounce-animation {
            animation: bounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounce {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 標題顯示區塊 -->
        <h1 id="result-title" class="title">今天吃什麼？</h1>

        <!-- 照片顯示區塊 -->
        <div id="image-container" class="image-container hidden">
            <img id="restaurant-img" src="" alt="餐廳照片">
        </div>

        <!-- 按鈕群組 -->
        <div class="button-group">
            <button id="draw-btn" class="btn btn-primary">點我抽籤</button>
            <a id="map-btn" class="btn btn-secondary hidden" href="#" target="_blank" rel="noopener noreferrer">馬上出發 (Google Maps)</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 餐廳清單資料
            const restaurants = [
                {
                    name: 'Soul ER 心靈急診室/精品咖啡館',
                    image: 'https://i.postimg.cc/nV7jTXC3/xin.jpg',
                    mapUrl: 'https://www.google.com/maps/search/?api=1&query=Soul+ER+心靈急診室'
                },
                {
                    name: '燕巢風味外省麵',
                    image: 'https://i.postimg.cc/nV7jTXC4/wai.jpg',
                    mapUrl: 'https://www.google.com/maps/search/?api=1&query=燕巢風味外省麵'
                },
                {
                    name: '深水食堂',
                    image: 'https://i.postimg.cc/wxJyF17P/shen.jpg',
                    mapUrl: 'https://www.google.com/maps/search/?api=1&query=深水食堂'
                },
                {
                    name: '金色三麥 義大店',
                    image: 'https://i.postimg.cc/ryW0gDKH/jin.jpg',
                    mapUrl: 'https://www.google.com/maps/search/?api=1&query=金色三麥+義大店'
                },
                {
                    name: '小林鴨肉飯',
                    image: 'https://i.postimg.cc/2jvbT1VM/ya.jpg',
                    mapUrl: 'https://www.google.com/maps/search/?api=1&query=小林鴨肉飯'
                }
            ];

            // 取得頁面元素
            const drawBtn = document.getElementById('draw-btn');
            const resultTitle = document.getElementById('result-title');
            const imageContainer = document.getElementById('image-container');
            const restaurantImg = document.getElementById('restaurant-img');
            const mapBtn = document.getElementById('map-btn');

            // 綁定點擊事件
            drawBtn.addEventListener('click', () => {
                // 隨機選取其中一個餐廳
                const randomIndex = Math.floor(Math.random() * restaurants.length);
                const selected = restaurants[randomIndex];

                // 移除先前的動畫類別（重置動畫）
                resultTitle.classList.remove('bounce-animation');
                
                // 強制瀏覽器重繪
                void resultTitle.offsetWidth;

                // 替換大標題並加上彈跳動畫
                resultTitle.textContent = selected.name;
                resultTitle.classList.add('bounce-animation');

                // 設定並顯示照片
                restaurantImg.src = selected.image;
                restaurantImg.alt = selected.name;
                imageContainer.classList.remove('hidden');

                // 設定並顯示 Google Map 連結按鈕
                mapBtn.href = selected.mapUrl;
                mapBtn.classList.remove('hidden');

                // 更新抽籤按鈕文字
                drawBtn.textContent = '再抽一次';
            });
        });
    </script>
</body>
</html>
