<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Princess Secret Wall 👑 皇室動態留言板</title>
  
  <!-- Google Fonts: 夢幻字體與手寫風 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">

  <style>
    /* ==================== 全局變數與重置 ==================== */
    :root {
      --princess-pink: #ffe6ee;
      --princess-soft-pink: #fff0f5;
      --princess-gold: #d4af37;
      --princess-gold-light: #f3e5ab;
      --princess-purple: #e6e6fa;
      --princess-deep-pink: #db7093;
      --princess-text: #5c3d46;
      --card-bg: rgba(255, 255, 255, 0.85);
      --shadow-soft: 0 10px 25px rgba(219, 112, 147, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background: linear-gradient(135deg, #ffe6ee 0%, #f7e8ff 50%, #ffe6f2 100%);
      background-attachment: fixed;
      color: var(--princess-text);
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景星光顆粒感裝飾 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(#fff 2px, transparent 2px);
      background-size: 30px 30px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ==================== 頁首標題風格 ==================== */
    header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    .crown-icon {
      font-size: 3.5rem;
      color: var(--princess-gold);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      animation: floatCrown 3s ease-in-out infinite;
      display: inline-block;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(45deg, #db7093, #9370db, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 10px 0;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
    }

    .subtitle {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      color: var(--princess-deep-pink);
    }

    /* ==================== 酷炫公主風載入動畫 ==================== */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    .magic-mirror {
      width: 100px;
      height: 100px;
      border: 4px solid var(--princess-gold);
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle, #fff, var(--princess-purple));
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 15px rgba(219, 112, 147, 0.4);
      animation: mirrorPulse 2s infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .magic-mirror::after {
      content: "✨";
      font-size: 2.5rem;
      animation: sparkle 1.5s infinite ease-in-out;
    }

    .loading-text {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--princess-deep-pink);
      letter-spacing: 1.5px;
      animation: blink 1.5s infinite;
    }

    /* ==================== 瀑布流排版 (Masonry Layout) ==================== */
    .masonry-grid {
      column-count: 3;
      column-gap: 25px;
      display: none; /* 載入完成後開啟 */
    }

    /* ==================== 留言卡片視覺 ==================== */
    .card {
      break-inside: avoid;
      margin-bottom: 25px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(212, 175, 55, 0.4);
      border-radius: 20px;
      padding: 25px;
      position: relative;
      box-shadow: var(--shadow-soft);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }

    /* 卡片蕾絲上邊框風格 */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--princess-gold), var(--princess-deep-pink), var(--princess-gold));
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--princess-gold);
      box-shadow: 0 15px 30px rgba(219, 112, 147, 0.35), 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px dashed rgba(219, 112, 147, 0.3);
      padding-bottom: 10px;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .author-icon {
      font-size: 1.2rem;
    }

    .author-name {
      font-weight: 600;
      font-size: 1.15rem;
      color: #7b2cbf;
    }

    .timestamp {
      font-size: 0.8rem;
      color: #9d8189;
    }

    .card-body {
      font-size: 0.98rem;
      line-height: 1.7;
      color: #4a3b32;
      white-space: pre-wrap; /* 保持悄悄話的換行格式 */
      word-break: break-word;
    }

    /* 悄悄話邊飾絲帶風格 */
    .whisper-tag {
      display: inline-block;
      font-size: 0.75rem;
      background: var(--princess-soft-pink);
      color: var(--princess-deep-pink);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(219, 112, 147, 0.3);
      margin-top: 15px;
    }

    /* 錯誤訊息樣式 */
    .error-msg {
      text-align: center;
      color: #d90429;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 15px;
      border: 2px solid #d90429;
      max-width: 500px;
      margin: 20px auto;
    }

    /* ==================== 關鍵幀動畫 (Keyframes) ==================== */
    @keyframes floatCrown {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    @keyframes mirrorPulse {
      0% { transform: scale(0.95); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
      100% { transform: scale(1.05); box-shadow: 0 0 30px rgba(219, 112, 147, 0.8); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ==================== 響應式 RWD 瀑布流欄位 ==================== */
    @media (max-width: 992px) {
      .masonry-grid {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      .masonry-grid {
        column-count: 1;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頁首標題區塊 -->
    <header>
      <div class="crown-icon">👑</div>
      <h1>Princess Secret Wall</h1>
      <div class="subtitle">~ 朋友對我的動態悄悄話留言板 ~</div>
    </header>

    <!-- 酷炫載入中動畫區塊 -->
    <div id="loading-container">
      <div class="magic-mirror"></div>
      <div class="loading-text">✨ 魔法鏡子讀取留言中... ✨</div>
    </div>

    <!-- 瀑布流卡片展示區塊 -->
    <main id="masonry-wall" class="masonry-grid"></main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRETftFkXYV4ucPDARMEognXXgttPqPgohIJtY3QpTSSosWoCn0Td7kQ4Jn8LNEilCS48C7hNBv4WdD/pub?output=csv';
      
      const loadingEl = document.getElementById('loading-container');
      const wallEl = document.getElementById('masonry-wall');

      // 1. 使用 fetch 撈取試算表資料
      fetch(csvUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP 錯誤狀態: ${response.status}`);
          }
          return response.text();
        })
        .then(csvText => {
          // 解析 CSV
          const dataArray = parseCSV(csvText);
          
          // 移除 CSV 第一行的標頭 (時間戳記, 名字, 悄悄話)
          if (dataArray.length > 0 && dataArray[0][0].includes("時間")) {
            dataArray.shift();
          }

          // 隱藏 Loading，顯示卡片牆
          loadingEl.style.display = 'none';
          wallEl.style.display = 'block';

          // 動態生成卡片
          renderCards(dataArray);
        })
        .catch(error => {
          console.error("讀取失敗:", error);
          loadingEl.innerHTML = `
            <div class="error-msg">
              <h3>✨ 魔法暫時失效了 ✨</h3>
              <p>無法讀取留言資料，請稍後再試。</p>
              <small>(${error.message})</small>
            </div>
          `;
        });

    /**
     * 高階專業 CSV 解析器 (Robust CSV Parser)
     * 正確處理雙引號包覆、內部含逗號 (,) 及換行符號 (\n) 的欄位
     */
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          // 處理雙引號轉義 (例如 CSV 內的 "")
          if (insideQuotes && nextChar === '"') {
            currentCell += '"';
            i++; // 跳過下一個引號
          } else {
            // 切換引號狀態
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          // 在雙引號外的逗號視為分隔符號
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          // 在雙引號外的換行視為列分隔符號
          if (char === '\r' && nextChar === '\n') {
            i++; // 跳過 \r\n
          }
          currentRow.push(currentCell.trim());
          if (currentRow.some(cell => cell !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }

      // 處理最後一個欄位
      if (currentCell || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        rows.push(currentRow);
      }

      return rows;
    }

    /**
     * 動態生成與渲染公主風卡片
     */
    function renderCards(posts) {
      if (posts.length === 0) {
        wallEl.innerHTML = '<p style="text-align:center; width:100%;">目前還沒有任何悄悄話留言唷 🌸</p>';
        return;
      }

      // 可愛宮廷風頭像圖示庫
      const icons = ['🌸', '💖', '🎀', '👑', '🌷', '🦄', '💎', '🍓'];

      posts.forEach(row => {
        // CSV 結構：[0]時間戳記, [1]名字, [2]悄悄話
        const timestamp = row[0] || '神秘時間';
        const name = row[1] || '匿名小公主';
        const message = row[2] || '（這條留言什麼都沒寫...）';

        // 隨機挑選頭像 icon
        const randomIcon = icons[Math.floor(Math.random() * icons.length)];

        // 建構 HTML 卡片結構
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-header">
            <div class="author-info">
              <span class="author-icon">${randomIcon}</span>
              <span class="author-name">${escapeHTML(name)}</span>
            </div>
            <span class="timestamp">${escapeHTML(timestamp)}</span>
          </div>
          <div class="card-body">${escapeHTML(message)}</div>
          <div class="whisper-tag">💌 Secret Message</div>
        `;

        wallEl.appendChild(card);
      });
    }

    /**
     * 防止 XSS 攻擊的字串轉義函數
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  });
  </script>
</body>
</html>
